defaults:
  vault_dir: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Personal/00_Self/ai-watch"
  data_dir: ./data
  window_hours: 30
  user_agent: "ai-watch/0.1 (personal reader; github.com/machamp0714)"
  claude_bin: ~/.local/bin/claude   # 2.1.239。/opt/homebrew/bin/claude は 2.1.34 で古い
  npx_bin: ~/.nodenv/shims/npx
  model: sonnet

sources:
  # ---- 公式 ----
  - id: claude-code-changelog
    type: github_file_sections
    group: official
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    page_url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    section_pattern: '^## (\d+\.\d+\.\d+)'
    title_prefix: "Claude Code "
    max_sections: 5
  - id: codex-releases
    type: github_releases
    group: official
    url: https://api.github.com/repos/openai/codex/releases?per_page=10
    title_prefix: "Codex "
  - id: openai-news
    type: rss
    group: official
    url: https://openai.com/news/rss.xml
  - id: claude-docs-release-notes
    type: github_file_sections
    group: official
    url: https://docs.claude.com/en/release-notes/overview.md
    page_url: https://docs.claude.com/en/release-notes/overview
    section_pattern: '^### ([A-Z][a-z]+ \d{1,2}, \d{4})'
    title_prefix: "Claude Platform release notes "
    max_sections: 5
  - id: anthropic-news
    type: html_diff
    group: official
    url: https://www.anthropic.com/news
    link_pattern: 'anthropic\.com/(news|research|engineering)/[a-z0-9-]+'
  - id: google-ai-blog
    type: rss
    group: official
    url: https://blog.google/technology/ai/rss/
  - id: claude-dev-blog          # Claude Code チームの実践記事（claude.com/blog の技術記事もここに移った）
    type: rss
    group: official
    url: https://claude.dev/rss.xml
  - id: anthropic-engineering    # /news からはリンクされないため別に見る
    type: html_diff
    group: official
    url: https://www.anthropic.com/engineering
    link_pattern: 'anthropic\.com/engineering/[a-z0-9-]+'
  - id: anthropic-research
    type: html_diff
    group: official
    url: https://www.anthropic.com/research
    link_pattern: 'anthropic\.com/research/[a-z0-9-]+'
  - id: claude-customers         # 導入事例
    type: html_diff
    group: official
    url: https://claude.com/customers
    link_pattern: 'claude\.com/customers/[a-z0-9-]+'
  - id: deepmind-blog
    type: rss
    group: official
    url: https://deepmind.google/blog/rss.xml
  - id: github-ai-blog
    type: rss
    group: official
    url: https://github.blog/ai-and-ml/feed/
  - id: cursor-changelog
    type: rss
    group: official
    url: https://cursor.com/changelog/rss.xml
  - id: amp-news
    type: rss
    group: official
    url: https://ampcode.com/news.rss
  - id: cognition-blog           # Devin。開発事例・事業の数字が出る
    type: html_diff
    group: official
    url: https://cognition.ai/blog
    link_pattern: 'cognition\.ai/blog/[a-z0-9-]+'

  # ---- EN コミュニティ ----
  - id: hn
    type: hn_algolia
    group: en
    queries: [claude, codex, anthropic, openai, llm, "ai agent", "coding agent"]
    min_points: 50
  - id: hn-top            # キーワードなしの高得点ストーリー（クエリに無い新しい名前の話題を拾う）
    type: hn_algolia
    group: en
    queries: [""]
    min_points: 300
  - id: simonwillison
    type: rss
    group: en
    url: https://simonwillison.net/atom/everything/
  - id: latent-space
    type: rss
    group: en
    url: https://www.latent.space/feed
  # 海外エンジニア・アナリストの発信（X の代わりに本人のブログ/ニュースレターを見る）
  - id: interconnects            # Nathan Lambert
    type: rss
    group: en
    url: https://www.interconnects.ai/feed
  - id: pragmatic-engineer       # Gergely Orosz
    type: rss
    group: en
    url: https://newsletter.pragmaticengineer.com/feed
  - id: one-useful-thing         # Ethan Mollick。業務での活用
    type: rss
    group: en
    url: https://www.oneusefulthing.org/feed
  - id: stratechery              # Ben Thompson。事業・戦略
    type: rss
    group: en
    url: https://stratechery.com/feed/
  - id: addy-osmani
    type: rss
    group: en
    url: https://addyo.substack.com/feed
  - id: hamel
    type: rss
    group: en
    url: https://hamel.dev/index.xml
  - id: eugene-yan
    type: rss
    group: en
    url: https://eugeneyan.com/rss/
  - id: karpathy
    type: rss
    group: en
    url: https://karpathy.bearblog.dev/feed/
  - id: steve-yegge
    type: rss
    group: en
    url: https://steve-yegge.medium.com/feed

  # ---- JP コミュニティ ----
  - id: zenn-claudecode
    type: zenn
    group: jp
    topic: claudecode
    url: https://zenn.dev/topics/claudecode/feed
    size: 20
    recheck_popularity: true
    min_likes: 30   # 未満は triage に回さず、再確認で 30 に届いたら出す
    lang: ja
  - id: zenn-codex
    type: zenn
    group: jp
    topic: codex
    url: https://zenn.dev/topics/codex/feed
    size: 20
    recheck_popularity: true
    min_likes: 30   # 未満は triage に回さず、再確認で 30 に届いたら出す
    lang: ja
  - id: zenn-llm
    type: zenn
    group: jp
    topic: llm
    url: https://zenn.dev/topics/llm/feed
    size: 20
    recheck_popularity: true
    min_likes: 30   # 未満は triage に回さず、再確認で 30 に届いたら出す
    lang: ja
  - id: hatena-claudecode
    type: rss
    group: jp
    url: "https://b.hatena.ne.jp/q/claude%20code?mode=rss&sort=recent"
    lang: ja
  - id: hatena-it-hot
    type: rss
    group: jp
    url: https://b.hatena.ne.jp/hotentry/it.rss
    lang: ja
    keywords: [claude, codex, llm, openai, anthropic, gpt, gemini, エージェント, 生成AI]
  - id: hatena-speakerdeck
    type: rss
    group: jp
    url: https://b.hatena.ne.jp/site/speakerdeck.com/?mode=rss   # 新しくブクマされた Speaker Deck のスライド
    lang: ja
    keywords: [claude, codex, llm, openai, anthropic, gpt, gemini, エージェント, agent, 生成ai, ai駆動, mcp]
  - id: note
    type: note_search
    group: jp
    queries: ["Claude Code", "Codex"]
    size: 20

  # ---- X（Playwright MCP）----
  - id: x
    type: x_mcp
    group: x
    urls:
      - https://x.com/i/bookmarks
      # - https://x.com/i/lists/<LIST_ID>   # 「LLM watch」リストを作ったら ID を入れる
    max_posts: 60
    budget_usd: 1.5
