defaults:
  vault_dir: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Personal/00_Self/ai-watch"
  data_dir: ./data
  window_hours: 30
  user_agent: "ai-watch/0.1 (personal reader; github.com/machamp0714)"
  claude_bin: ~/.local/bin/claude   # 2.1.239。/opt/homebrew/bin/claude は 2.1.34 で古い
  npx_bin: ~/.nodenv/shims/npx
  model: sonnet

sources:
  # ---- 公式 ----
  - id: claude-code-changelog
    type: github_file_sections
    group: official
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    page_url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    section_pattern: '^## (\d+\.\d+\.\d+)'
    title_prefix: "Claude Code "
    max_sections: 5
  - id: codex-releases
    type: github_releases
    group: official
    url: https://api.github.com/repos/openai/codex/releases?per_page=10
    title_prefix: "Codex "
  - id: openai-news
    type: rss
    group: official
    url: https://openai.com/news/rss.xml
  - id: claude-docs-release-notes
    type: github_file_sections
    group: official
    url: https://docs.claude.com/en/release-notes/overview.md
    page_url: https://docs.claude.com/en/release-notes/overview
    section_pattern: '^### ([A-Z][a-z]+ \d{1,2}, \d{4})'
    title_prefix: "Claude Platform release notes "
    max_sections: 5
  - id: anthropic-news
    type: html_diff
    group: official
    url: https://www.anthropic.com/news
    link_pattern: 'anthropic\.com/(news|research|engineering)/[a-z0-9-]+'
  - id: google-ai-blog
    type: rss
    group: official
    url: https://blog.google/technology/ai/rss/

  # ---- EN コミュニティ ----
  - id: hn
    type: hn_algolia
    group: en
    queries: [claude, codex, anthropic, openai, llm, "ai agent", "coding agent"]
    min_points: 50
  - id: reddit-claudeai
    type: rss
    group: en
    url: https://www.reddit.com/r/ClaudeAI/top.rss?t=day
  - id: reddit-claudecode
    type: rss
    group: en
    url: https://www.reddit.com/r/ClaudeCode/top.rss?t=day
  - id: reddit-localllama
    type: rss
    group: en
    url: https://www.reddit.com/r/LocalLLaMA/top.rss?t=day
  - id: reddit-openai
    type: rss
    group: en
    url: https://www.reddit.com/r/OpenAI/top.rss?t=day
  - id: simonwillison
    type: rss
    group: en
    url: https://simonwillison.net/atom/everything/
  - id: latent-space
    type: rss
    group: en
    url: https://www.latent.space/feed

  # ---- JP コミュニティ ----
  - id: zenn-claudecode
    type: rss
    group: jp
    url: https://zenn.dev/topics/claudecode/feed
    lang: ja
  - id: zenn-codex
    type: rss
    group: jp
    url: https://zenn.dev/topics/codex/feed
    lang: ja
  - id: zenn-llm
    type: rss
    group: jp
    url: https://zenn.dev/topics/llm/feed
    lang: ja
  - id: hatena-claudecode
    type: rss
    group: jp
    url: "https://b.hatena.ne.jp/q/claude%20code?mode=rss&sort=recent"
    lang: ja
  - id: hatena-it-hot
    type: rss
    group: jp
    url: https://b.hatena.ne.jp/hotentry/it.rss
    lang: ja
    keywords: [claude, codex, llm, openai, anthropic, gpt, gemini, エージェント, 生成AI]
  - id: note
    type: note_search
    group: jp
    queries: ["Claude Code", "Codex"]
    size: 20

  # ---- X（Playwright MCP）----
  - id: x
    type: x_mcp
    group: x
    urls:
      - https://x.com/i/bookmarks
      # - https://x.com/i/lists/<LIST_ID>   # 「LLM watch」リストを作ったら ID を入れる
    max_posts: 60
    budget_usd: 1.5
