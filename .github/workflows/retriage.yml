name: Retriage

# 過去日の選別を現在のプロンプト・ロジックでやり直し、ダイジェストを再生成する（seen は更新しない）
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "再判定する日付（YYYY-MM-DD を空白区切り）"
        required: true
        type: string

permissions: {}

concurrency:
  group: ai-watch-nightly
  cancel-in-progress: false

jobs:
  retriage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uvを準備
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.17"
          enable-cache: false
      - name: Python依存を準備
        run: uv sync --frozen
      - name: AWS CLI v2を確認
        shell: bash
        run: |
          version="$(aws --version 2>&1)"
          case "$version" in
            aws-cli/2.*) printf '%s\n' "$version" ;;
            *) printf '%s\n' 'AWS CLI v2が必要です' >&2; exit 1 ;;
          esac
      - name: Claude Codeを準備
        run: npm install --global --prefix "$HOME/.local" @anthropic-ai/claude-code@2.1.269
      - name: R2から取得
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: uv run ai-watch-r2 pull --root "$RUNNER_TEMP/ai-watch-runtime"
      - name: 選別をやり直す
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          AI_WATCH_VAULT_DIR: ${{ runner.temp }}/ai-watch-runtime/vault
          AI_WATCH_DATA_DIR: ${{ runner.temp }}/ai-watch-runtime/data
          AI_WATCH_WATCHLIST_FILE: ${{ runner.temp }}/ai-watch-runtime/config/watchlist.yaml
          AI_WATCH_CHECKS_DIR: ${{ runner.temp }}/ai-watch-runtime/checks
          DATES: ${{ inputs.dates }}
        shell: bash
        run: |
          for day in $DATES; do
            if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              printf '日付の形式が不正です: %s\n' "$day" >&2
              exit 1
            fi
          done
          for day in $DATES; do
            uv run ai-watch nightly --date "$day" --from triage --retriage --skip-x-collect >> "$RUNNER_TEMP/retriage-report.json"
          done
      - name: R2へ成果物を保存
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: uv run ai-watch-r2 push-results --root "$RUNNER_TEMP/ai-watch-runtime"
