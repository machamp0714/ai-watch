name: Claude API probe

on:
  workflow_dispatch:
  push:
    branches:
      - docs/flow-diagram
    paths:
      - .github/workflows/claude-api-probe.yml
      - src/ai_watch/claude_api_probe.py
      - src/ai_watch/claude_runner.py
      - tests/test_claude_api_probe.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: false
      - name: Python依存を準備
        run: uv sync --frozen
      - name: Claude Codeを準備
        run: npm install --global @anthropic-ai/claude-code@2.1.269
      - name: API keyと構造化出力を検証
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m ai_watch.claude_api_probe
