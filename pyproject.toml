[project]
name = "ai-watch"
version = "0.1.0"
description = "LLM 情報の夜間収集・トリアージ・Obsidian ダイジェスト生成"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.scripts]
ai-watch = "ai_watch.cli:main"
ai-watch-r2 = "ai_watch.r2_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
